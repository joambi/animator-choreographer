name: Linux-Build

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Pakete an dieses Release anhängen (z. B. v0.1.0, auch Entwurf); leer = nur bauen"
        required: false
        default: ""

jobs:
  build:
    # 22.04: aelteres glibc (2.35) -> Pakete laufen auch auf Ubuntu 22.04/24.04, Debian 12 und neuer
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Abhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libasound2-dev \
            libgl1-mesa-dev xvfb

      - name: Konfigurieren (JUCE 8.0.12 per FetchContent)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Bauen
        run: cmake --build build --parallel

      - name: Tests
        run: |
          TESTS=$(find build -type f -name ChoreoTests -perm -u+x | head -1)
          "$TESTS" build/test-out tests/data/test-gp.xml

      - name: Pakete (.tar.gz, .deb)
        run: installer/make-linux-packages.sh build dist

      - name: Paket-Prüfung (Installation, Start ohne Bildschirm)
        run: |
          sudo apt-get install -y ./dist/animator-choreographer_*_amd64.deb
          xvfb-run -a -s "-screen 0 1600x1000x24" animator-choreographer --snapshot dist-check.png --step 5
          test -s dist-check.png

      - uses: actions/upload-artifact@v4
        with:
          name: AnimatorChoreographer-Linux
          path: |
            dist/*.tar.gz
            dist/*.deb

      - name: An Release anhängen
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$TAG" dist/*.tar.gz dist/*.deb --clobber
